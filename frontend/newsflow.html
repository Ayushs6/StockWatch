<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News — StockWatch</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="newsflow.css">
</head>
<body>
    <canvas class="bg-canvas" id="bgCanvas" aria-hidden="true"></canvas>

    <div class="app">
        <header class="header">
            <div class="header-inner newsflow-header-inner">
                <div class="newsflow-header-left">
                    <a href="javascript:history.back()" class="back-btn" aria-label="Back">
                        <svg viewBox="0 0 20 20" fill="none" width="18" height="18">
                            <path d="M12 5L7 10L12 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        Back
                    </a>
                    <div class="newsflow-title">
                        <span class="newsflow-ticker" id="headerTicker">—</span>
                        <span class="newsflow-label">News Flow</span>
                    </div>
                </div>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"></button>
            </div>
        </header>

        <main class="newsflow-main">
            <div class="newsflow-count" id="newsCount"></div>
            <div class="newsflow-list" id="newsList">
                <div class="feed-loader"><div class="spinner-ring"></div></div>
            </div>
        </main>
    </div>

    <script src="bg.js"></script>
    <script src="theme.js"></script>
    <script src="newsflow.js"></script>
</body>
</html>
